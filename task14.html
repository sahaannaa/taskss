<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px; /* Add some margin around the main container */
            background-color: #f0f0f0;
            display: flex;
            justify-content: flex-start; /* Align content to the start */
        }

        .container {
            display: flex;
            border: 1px solid #000000; /* Border for the main container */
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1); /* Optional shadow */
            background-color: white; /* White background for the container */
            border-radius: 5px; /* Optional rounded corners for the container */
            overflow: hidden; /* Clip any content that goes outside the rounded corners */
        }

        .sidenav {
            width: 50px;
            
            padding: 10px 0; /* Add some vertical padding */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sidenav a {
            width: 70px;
            height: 30px;
            margin-bottom: 5px;
            text-decoration: none;
            display: block;
            opacity: 0.8;
            transition: opacity 0.3s ease;
            border-radius: 5px; /* Curve the buttons */
        }

        .sidenav a:hover {
            opacity: 1;
        }

        .sidenav .green {
            background-color: #4CAF50; /* Green */
        }

        .sidenav .blue {
            background-color: #2196F3; /* Blue */
        }

        .sidenav .red {
            background-color: #f44336; /* Red */
        }

        .sidenav .gray {
            background-color: #808080; /* Gray */
        }

        .main {
            padding: 20px;
        }

        .main h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidenav">
            <a href="#" class="green"></a>
            <a href="#" class="blue"></a>
            <a href="#" class="red"></a>
            <a href="#" class="gray"></a>
        </div>
        <div class="main">
            <h2>Hoverable Sidenav Buttons</h2>
            <p>Hover over the buttons in the left side navigation to open them.</p>
        </div>
    </div>

</body>
</html>
