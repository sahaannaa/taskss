<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px; 
            background-color: #f0f0f0;
            display: flex;
            justify-content: flex-start;
        }

        .container {
            display: flex;
            border: 1px solid #000000; 
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1); 
            background-color: white; 
            border-radius: 5px; 
            overflow: hidden; 
        }

        .sidenav {
            width: 50px;
            
            padding: 10px 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sidenav a {
            width: 70px;
            height: 30px;
            margin-bottom: 5px;
            text-decoration: none;
            display: block;
            opacity: 0.8;
            transition: opacity 0.3s ease;
            border-radius: 5px; 
        }

        .sidenav a:hover {
            opacity: 1;
        }

        .sidenav .green {
            background-color: #4CAF50;
        }

        .sidenav .blue {
            background-color: #2196F3; 
        }

        .sidenav .red {
            background-color: #f44336; 
        }

        .sidenav .gray {
            background-color: #808080;
        }

        .main {
            padding: 20px;
        }

        .main h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidenav">
            <a href="#" class="green"></a>
            <a href="#" class="blue"></a>
            <a href="#" class="red"></a>
            <a href="#" class="gray"></a>
        </div>
        <div class="main">
            <h2>Hoverable Sidenav Buttons</h2>
            <p>Hover over the buttons in the left side navigation to open them.</p>
        </div>
    </div>

</body>
</html>
