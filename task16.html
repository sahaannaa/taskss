<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Styled Page</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #ffffff; /* White background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .page-container {
            background-color: #adb54c; /* Olive green background for the container */
            padding: 30px;
            border: 2px solid #000000; /* Black border */
            border-radius: 8px;
            box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 30px;
            max-width: 800px;
        }
        .content .date-container {
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px dotted #000000; /* Dotted line before "Made by" */
            text-align: right; /* Align "Made by" to the right */
        }

        .sidebar {
            padding: 20px;
            border-radius: 5px;
            width: 200px; /* Adjust sidebar width as needed */
            /* Removed background-color from sidebar */
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar ul li {
            margin-bottom: 10px;
        }

        .sidebar ul li a {
            display: block;
            padding: 10px 15px;
            text-decoration: none;
            color: #333;
            background-color: white;
            border-right: 15px solid #000000; /* Black indicator */
            border-radius: 3px;
        }

        .sidebar ul li a:hover {
            background-color: #e9ecef; /* Light gray on hover */
        }

        .content {
            flex-grow: 1;
            color: #ac3a6f; /* Pinkish color for text content */
            padding-top: 0;
        }

        .content h1 {
            color: #ac3a6f; /* Pinkish heading */
            margin-top: 0;
        }

        .content p {
            line-height: 1.6;
        }

        .content .date {
            font-style: italic;
            color: #ac3a6f;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="sidebar">
            <ul>
                <li><a href="#">Home page</a></li>
                <li><a href="#">Musings</a></li>
                <li><a href="#">My town</a></li>
                <li><a href="#">Links</a></li>
            </ul>
        </div>
        <div class="content">
            <h1>My first styled page</h1>
            <p>Welcome to my styled page!</p>
            <p>It lacks images, but at least it has style. And it has links, even if they don't go anywhere...</p>
            <p>There should be more here, but I don't know what yet.</p>
            <div class="date-container">
                <p class="date">Made 5 April 2004<br>by myself.</p>
            </div>
        </div>
    </div>

</body>
</html>
