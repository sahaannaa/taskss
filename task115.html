<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2-Column Validation Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #fff;
      color: #000;
    }

    label {
      font-weight: 500;
      margin-bottom: 0;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label-col {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-label-col i {
      color: #000;
      transition: color 0.2s;
    }

    .form-control,
    .form-select,
    textarea {
      border: 1px solid #000;
      color: #000;
      background-color: #fff;
      transition: border-color 0.2s, color 0.2s;
    }

    .form-control.error,
    .form-select.error,
    textarea.error {
      border-color: #dc3545 !important;
      color: #dc3545 !important;
    }

    .form-label-col i.error {
      color: #dc3545;
    }

    .error-text {
      color: #dc3545;
      font-size: 0.875em;
      display: none;
    }

    .error-text.active {
      display: block;
    }
  </style>
</head>
<body class="p-4">

<div class="container">
  <form id="customForm" novalidate>
    <div class="form-group row">
      <div class="col-md-4 form-label-col">
        <i class="bi bi-person-fill icon"></i>
        <label for="firstName">First Name</label>
      </div>
      <div class="col-md-8">
        <input type="text" class="form-control" id="firstName" placeholder="First Name">
        <div class="error-text">Please supply your first name</div>
      </div>
    </div>

    <div class="form-group row">
      <div class="col-md-4 form-label-col">
        <i class="bi bi-person-fill icon"></i>
        <label for="lastName">Last Name</label>
      </div>
      <div class="col-md-8">
        <input type="text" class="form-control" id="lastName" placeholder="Last Name">
        <div class="error-text">Please supply your last name</div>
      </div>
    </div>

    <div class="form-group row">
      <div class="col-md-4 form-label-col">
        <i class="bi bi-envelope-fill icon"></i>
        <label for="email">E-Mail</label>
      </div>
      <div class="col-md-8">
        <input type="email" class="form-control" id="email" placeholder="E-Mail Address">
        <div class="error-text">Please supply your email address</div>
      </div>
    </div>

    <div class="form-group row">
      <div class="col-md-4 form-label-col">
        <i class="bi bi-telephone-fill icon"></i>
        <label for="phone">Phone #</label>
      </div>
      <div class="col-md-8">
        <input type="text" class="form-control" id="phone" placeholder="(845)555-1212">
        <div class="error-text">Please supply your phone number</div>
      </div>
    </div>

    <div class="form-group row">
      <div class="col-md-4 form-label-col">
        <i class="bi bi-house-door-fill icon"></i>
        <label for="address">Address</label>
      </div>
      <div class="col-md-8">
        <input type="text" class="form-control" id="address" placeholder="Address">
        <div class="error-text">Please supply your address</div>
      </div>
    </div>

    <div class="form-group row">
      <div class="col-md-4 form-label-col">
        <i class="bi bi-geo-alt-fill icon"></i>
        <label for="city">City</label>
      </div>
      <div class="col-md-8">
        <input type="text" class="form-control" id="city" placeholder="City">
        <div class="error-text">Please supply your city</div>
      </div>
    </div>

    <div class="form-group row">
      <div class="col-md-4 form-label-col">
        <label for="state">State</label>
      </div>
      <div class="col-md-8">
        <select class="form-select" id="state">
          <option value="">Please select your state</option>
          <option>New York</option>
          <option>California</option>
          <option>Texas</option>
        </select>
        <div class="error-text">Please select your state</div>
      </div>
    </div>

    <div class="form-group row">
      <div class="col-md-4 form-label-col">
        <label>Do you have hosting?</label>
      </div>
      <div class="col-md-8">
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="hosting" id="hostingYes" value="yes">
          <label class="form-check-label" for="hostingYes">Yes</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="hosting" id="hostingNo" value="no">
          <label class="form-check-label" for="hostingNo">No</label>
        </div>
        <div class="error-text">Please select hosting option</div>
      </div>
    </div>

    <div class="form-group row">
      <div class="col-md-4 form-label-col">
        <label for="description">Project Description</label>
      </div>
      <div class="col-md-8">
        <textarea class="form-control" id="description" placeholder="Describe your project"></textarea>
        <div class="error-text">Please describe your project</div>
      </div>
    </div>

    <div class="form-group row">
      <div class="offset-md-4 col-md-8">
        <button class="btn btn-dark" type="submit">Send</button>
      </div>
    </div>
  </form>
</div>

<script>
  document.getElementById("customForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const fields = [
      { id: "firstName" },
      { id: "lastName" },
      { id: "email" },
      { id: "phone" },
      { id: "address" },
      { id: "city" },
      { id: "state" },
      { id: "description" }
    ];

    let valid = true;

    fields.forEach(({ id }) => {
      const input = document.getElementById(id);
      const container = input.closest(".row");
      const errorText = container.querySelector(".error-text");
      const icon = container.querySelector("i");

      if (!input.value.trim()) {
        input.classList.add("error");
        icon && icon.classList.add("error");
        errorText.classList.add("active");
        valid = false;
      } else {
        input.classList.remove("error");
        icon && icon.classList.remove("error");
        errorText.classList.remove("active");
      }
    });

    const hostingYes = document.getElementById("hostingYes");
    const hostingNo = document.getElementById("hostingNo");
    const radioError = hostingYes.closest(".row").querySelector(".error-text");

    if (!hostingYes.checked && !hostingNo.checked) {
      radioError.classList.add("active");
      valid = false;
    } else {
      radioError.classList.remove("active");
    }

    if (valid) {
      alert("Form submitted successfully!");
    }
  });
</script>

</body>
</html>
