<!DOCTYPE html>
<html>
<head>
<title>Task 2</title>
<style>
  body {
    display: flex; 
    flex-direction: column; 
    align-items: center; 
  }
  .container {
    border: 2px solid #000000;
    padding: 20px;
    margin-bottom: 20px;
    width: 80%; 
    max-width: 600px; 
  }
  .box {
    border: 2px solid #000000;
    padding: 10px;
    margin-bottom: 20px;
    width: 300px; 
    text-align: left; 
  }
</style>
</head>
<body>

  <div class="box">
    <p>Lists can be nested (list inside list):</p>
    <ul>
      <li>Coffee</li>
      <li>Tea
        <ul>
          <li>Black tea</li>
          <li>Green tea</li>
        </ul>
      </li>
      <li>Milk</li>
    </ul>
  </div>

  <div class="container">
    <p>Click any of the following links</p>
    <p>
      <a href="https://www.google.com/" target="_blank">Opens in New</a> |
      <a href="https://www.google.com/" target="_self">Opens in Self</a> |
      <a href="https://www.google.com/" target="_parent">Opens in Parent</a> |
      <a href="https://www.google.com/" target="_top">Opens in Body</a>
    </p>
  </div>

</body>
</html>
