<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 800px;
        }
        .form-label {
            font-weight: bold;
        }
        .form-control,
        .form-select {
            border: 1px solid black !important;
            border-radius: 5px !important;
            background-color: #f8f9fa !important;
        }
        .form-check-input {
            border: 1px solid black !important;
            border-radius: 3px !important;
        }
        .form-check-label {
            margin-left: 5px;
        }
        textarea.form-control {
            resize: vertical;
        }
        .input-box {
            border: 1px solid #000000;
            padding: 5px;
            background-color: #ffffff;
        }
        .label-border {
            border-right: 2px solid #000;
            padding-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center text-primary mb-4">Registration Form</h2>
        <form>

            <div class="input-box">
                <div class="row mb-3">
                    <label for="firstName" class="col-sm-4 col-form-label label-border">First Name</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" id="firstName" name="firstName">
                    </div>
                </div>
            </div>

            <div class="input-box">
                <div class="row mb-3">
                    <label for="lastName" class="col-sm-4 col-form-label label-border">Last Name</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" id="lastName" name="lastName">
                    </div>
                </div>
            </div>

            <div class="input-box">
                <div class="row mb-3">
                    <label for="email" class="col-sm-4 col-form-label label-border">Email</label>
                    <div class="col-sm-8">
                        <input type="email" class="form-control" id="email" name="email">
                    </div>
                </div>
            </div>

            <div class="input-box">
                <div class="row mb-3">
                    <label for="password" class="col-sm-4 col-form-label label-border">Password</label>
                    <div class="col-sm-8">
                        <input type="password" class="form-control" id="password" name="password">
                    </div>
                </div>
            </div>

            <div class="input-box">
                <div class="row mb-3">
                    <label for="rePassword" class="col-sm-4 col-form-label label-border">Re-enter Password</label>
                    <div class="col-sm-8">
                        <input type="password" class="form-control" id="rePassword" name="rePassword">
                    </div>
                </div>
            </div>

            <div class="input-box">
                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label label-border">Gender</label>
                    <div class="col-sm-8 d-flex align-items-center gap-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gender" id="male" value="male">
                            <label class="form-check-label" for="male">Male</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                            <label class="form-check-label" for="female">Female</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-box">
                <div class="row mb-3">
                    <label for="age" class="col-sm-4 col-form-label label-border">Age</label>
                    <div class="col-sm-8">
                        <input type="number" class="form-control" id="age" name="age">
                    </div>
                </div>
            </div>

            <div class="input-box">
                <div class="row mb-3">
                    <label for="phone" class="col-sm-4 col-form-label label-border">Phone Number</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" id="phone" name="phone">
                    </div>
                </div>
            </div>

            <div class="input-box">
                <div class="row mb-3">
                    <label for="address" class="col-sm-4 col-form-label label-border">Address</label>
                    <div class="col-sm-8">
                        <textarea class="form-control" id="address" name="address"></textarea>
                    </div>
                </div>
            </div>

            <div class="input-box">
                <div class="row mb-3">
                    <label for="state" class="col-sm-4 col-form-label label-border">State</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" id="state" name="state">
                    </div>
                </div>
            </div>

            <div class="input-box">
                <div class="row mb-3">
                    <label for="country" class="col-sm-4 col-form-label label-border">Country</label>
                    <div class="col-sm-8">
                        <select class="form-select" id="country" name="country">
                            <option value="">Choose your country</option>
                            <option value="india">India</option>
                            <option value="usa">United States</option>
                            <option value="uk">United Kingdom</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="input-box">
                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label label-border">Languages Known</label>
                    <div class="col-sm-8">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="english" value="english">
                            <label class="form-check-label" for="english">English</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="kannada" value="kannada">
                            <label class="form-check-label" for="kannada">Kannada</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="hindi" value="hindi">
                            <label class="form-check-label" for="hindi">Hindi</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="telugu" value="telugu">
                            <label class="form-check-label" for="telugu">Telugu</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-box">
                <div class="row mb-3">
                    <div class="col-sm-12 form-check">
                        <input class="form-check-input" type="checkbox" id="declare">
                        <label class="form-check-label" for="declare">
                            Hereby I declare all the given details are true
                        </label>
                    </div>
                </div>
            </div>

            <div class="input-box">
                <div class="row mb-3">
                    <div class="col text-end">
                        Log in to <a href="https://www.acharya.ac.in/" target="_blank">Acharya website</a>
                    </div>
                </div>
            </div>

            <div class="text-center mt-3">
                <button type="submit" class="btn btn-primary">Register</button>
            </div>

        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
